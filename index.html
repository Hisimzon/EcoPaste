<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>EcoPaste</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #root {
        width: 100%;
        height: 100%;
        border-radius: 10px;
        overflow: hidden;
      }

      .app-booting {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        user-select: none;
      }

      .app-booting-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(128, 128, 128, 0.7);
        animation: app-booting-pulse 700ms ease-in-out infinite alternate;
      }

      @keyframes app-booting-pulse {
        from {
          opacity: 0.35;
          transform: scale(0.85);
        }

        to {
          opacity: 0.85;
          transform: scale(1.15);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="app-booting">
        <span class="app-booting-dot"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
